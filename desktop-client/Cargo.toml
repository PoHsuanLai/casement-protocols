[package]
name = "desktop-client"
description = "One typed Wayland desktop client for wlroots-style compositors: toplevels, workspaces, outputs and output capture, as pure state plus a wire layer and a fake."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
casement-protocols = { workspace = true }
wayland-client = { workspace = true, optional = true }
wayland-protocols = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[features]
default = []
# The wire layer: binds the globals on a caller-supplied connection.
client = [
  "casement-protocols/client",
  "dep:wayland-client",
  "dep:wayland-protocols",
  "dep:wayland-protocols-wlr",
  "dep:rustix",
]
# The fake: scripted events in, recorded commands out. Pure; no Wayland.
fake = []

[lints]
workspace = true
